# =============================================================
# Build e push da imagem java8-python para o GHCR
#
# Triggers:
#   - Push em main        → publica como :latest
#   - Push de tag vX.Y.Z  → publica como :vX.Y.Z e :latest
#   - Pull Request        → só builda, não faz push (validação)
# =============================================================

name: Build & Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # adailtonbsf/java8-python

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        version: [java8, java21]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extrair metadados (tags e labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Tag específica da versão (ex: :java8, :java21)
            type=raw,value=${{ matrix.version }}
            # Se for Java 8 e estiver na main, marca como :latest para compatibilidade
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' && matrix.version == 'java8' }}
            # Tags de versão semver se houver
            type=semver,pattern={{version}},suffix=-${{ matrix.version }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.version }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.version }},mode=max